name: Build

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  desktop:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Publish Game Booster
        run: dotnet publish src/GameBooster/GameBooster.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:IncludeAllContentForSelfExtract=true
      - uses: actions/upload-artifact@v4
        with:
          name: GameBooster-win-x64
          path: src/GameBooster/bin/Release/net8.0-windows/win-x64/publish/GameBooster.exe
          if-no-files-found: error
      - name: Attach the executable to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src/GameBooster/bin/Release/net8.0-windows/win-x64/publish/GameBooster.exe

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloud/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
