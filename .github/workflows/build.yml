name: Build

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  desktop:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Publish Game Booster
        run: dotnet publish src/GameBooster/GameBooster.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:IncludeAllContentForSelfExtract=true
      - uses: actions/upload-artifact@v4
        with:
          name: GameBooster-win-x64
          path: src/GameBooster/bin/Release/net8.0-windows/win-x64/publish/GameBooster.exe
          if-no-files-found: error
      - name: Package GameBooster-win-x64.zip
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $dir = "src/GameBooster/bin/Release/net8.0-windows/win-x64/publish"
          if (-not (Test-Path (Join-Path $dir "GameBooster.exe"))) { throw "GameBooster.exe is missing." }
          tar -a -c -f GameBooster-win-x64.zip -C $dir GameBooster.exe
          Get-Item GameBooster-win-x64.zip | Format-List Name, Length
      - name: Publish the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          name: Game Booster ${{ github.ref_name }}
          body: |
            Exécutable Windows autonome (win-x64, .NET 8 inclus).
            Le téléchargement public est `GameBooster.exe`. `GameBooster-win-x64.zip` contient le même fichier.
          files: |
            src/GameBooster/bin/Release/net8.0-windows/win-x64/publish/GameBooster.exe
            GameBooster-win-x64.zip

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloud/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  binding-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Audit XAML bindings
        run: dotnet test tests/BindingAudit.Tests/BindingAudit.Tests.csproj -c Release
